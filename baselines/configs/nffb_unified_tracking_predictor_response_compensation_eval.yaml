env_config: environments/configs/unified_tracking_constant_response_d8.yaml
policy_config: baselines/configs/nffb_optimal.yaml

# D=8 plant/reference prediction plus exact nominal response inversion. The
# fixed environment ranges make every response parameter safely resolvable.
policy_overrides:
  state_predictor:
    enabled: true
    delay_step: 8
    solver: rk4
    step_dt: auto
    max_acc: auto
    max_velocity: auto
    velocity_response_enabled: true
    velocity_response_tau_s: 0.187
    velocity_response_gain: 1.0
    velocity_response_bias: -0.00485
    velocity_response_max_abs_velocity: auto
    plank_length: auto
    rope_length: auto
    ball_position_offset: auto
    gravity: auto
    ball_mass: auto
    ball_radius: auto
    ball_inertia_ratio: auto
    epsilon: auto
  velocity_response_compensation:
    enabled: true
    parameter_source: state_predictor
    tau_s: 0.187
    gain: 1.0
    bias: -0.00485
    max_abs_velocity: 0.0

runner:
  target_episodes: 10
  max_steps: null
  render: false
  save_rollout: true

logging:
  root_dir: logs/nffb/unified_tracking_icra/response_compensation
  run_name: nffb_unified_predictor_response_compensation_d8
