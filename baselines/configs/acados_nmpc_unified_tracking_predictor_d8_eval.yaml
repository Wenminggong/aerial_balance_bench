env_config: environments/configs/unified_tracking_sine_delay_d8_h38.yaml
policy_config: baselines/configs/acados_nmpc_unified.yaml

policy_overrides:
  state_predictor:
    enabled: true
    delay_step: 8
    solver: rk4
    velocity_response_enabled: true
    velocity_response_tau_s: 0.155
    velocity_response_gain: 0.86
    velocity_response_bias: -0.0035
    velocity_response_max_abs_velocity: 0.0

runner:
  target_episodes: 500
  max_steps: null
  stop_on_target_episodes: true
  render: false
  save_rollout: true

logging:
  root_dir: logs/acados_nmpc/unified_tracking
  run_name: acados_nmpc_unified_sine_predictor_d8
