policy_name: rl
algorithm: rpo
observation_mode: error9
checkpoint_path: null
load_checkpoint: true
deterministic: true
physical_action_limit: auto

network:
  layer_num: 3
  hidden_dim: 256
  clip_actions: true
  clip_log_std: true
  min_log_std: -20.0
  max_log_std: 2.0
  reduction: sum
  pid_obs: false

agent:
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 0.0003
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: true
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0
  rewards_shaper: null
  time_limit_bootstrap: false

state_predictor:
  enabled: true
  type: ukf_random_jerk
  delay_step: auto
  solver: rk4
  step_dt: auto
  max_delta_acc: auto
  max_acc: auto
  max_velocity: auto
  plank_length: auto
  rope_length: auto
  gravity: auto
  ball_mass: 0.0005
  ball_radius: auto
  ball_inertia_ratio: 0.4
  epsilon: 1.0e-9
  acceleration_response_model: deterministic
  # acceleration_response_source: extras_or_config
  # acceleration_response_tau_s: auto
  # acceleration_response_gain: auto
  # acceleration_response_bias: auto
  # acceleration_response_noise_mode: auto
  # acceleration_response_noise_std: auto
  # acceleration_response_ou_theta: auto
  # acceleration_response_noise_clip: auto
  # acceleration_response_max_abs_acc: auto
  acceleration_response_source: config
  acceleration_response_tau_s: 0.02
  acceleration_response_gain: 1.05
  acceleration_response_bias: -0.15
  acceleration_response_noise_mode: none
  acceleration_response_noise_std: 0.0
  acceleration_response_ou_theta: 0.0
  acceleration_response_noise_clip: 0.0
  acceleration_response_max_abs_acc: 6.5
  ukf_random_jerk:
    lambda_j: 1.0
    alpha: 1.0e-3
    beta: 2.0
    kappa: 0.0
    process_covariance_diag: [1.0e-5, 1.0e-3, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
    measurement_covariance_diag: [1.0e-6, 1.0e-4, 1.0e-6, 1.0e-3, 1.0e-2]
    initial_covariance_diag: [1.0e-5, 1.0e-3, 1.0e-5, 1.0e-2, 1.0e-1, 1.0e-1]
    human_velocity_key: external_disturbance_vel_z
    human_velocity_sign: 1.0
    missing_human_velocity_policy: zero
