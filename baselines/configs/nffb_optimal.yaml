policy_name: nffb

model:
  plank_length: auto
  rope_length: auto
  ball_position_offset: auto
  gravity: auto
  ball_mass: auto
  ball_radius: auto
  ball_inertia_ratio: 0.4
  epsilon: 1.0e-6

