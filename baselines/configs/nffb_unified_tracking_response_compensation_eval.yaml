env_config: environments/configs/unified_tracking_mixed.yaml
policy_config: baselines/configs/nffb_sine_phase0_acc5.yaml

# D=0 response compensation remains independent of delay prediction. Response
# parameters are resolved on the predictor config and reused by the inverse.
policy_overrides:
  state_predictor:
    enabled: false
    delay_step: 0
    step_dt: auto
    max_acc: auto
    max_velocity: auto
    velocity_response_enabled: true
    # The mixed environment randomizes the target response per environment;
    # use the range midpoint as the deterministic nominal inverse model.
    velocity_response_tau_s: 0.155
    velocity_response_gain: 0.86
    velocity_response_bias: -0.0035
    velocity_response_max_abs_velocity: auto
  velocity_response_compensation:
    enabled: true
    parameter_source: state_predictor

runner:
  target_episodes: 10
  max_steps: null
  render: false
  save_rollout: true

logging:
  root_dir: logs/nffb/unified_tracking
  run_name: nffb_unified_response_compensation_d0
