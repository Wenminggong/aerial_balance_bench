schema_version: 2

paths:
  source_dir: logs/real_world/acados_nmpc_cpp/real_world_acados_unified_20260815
  processed_dir: residual_dynamics/data/processed_causal
  training_runs_dir: residual_dynamics/runs/training_causal
  wandb_dir: residual_dynamics/runs/wandb_causal
  results_dir: residual_dynamics/results_causal
  report_path: residual_dynamics/REPORT_CAUSAL.md

data:
  standard_groups:
    - constant_015
    - constant_035
    - constant_055
    - sine_period_6
    - sine_period_8
    - triangle_period_6
    - triangle_period_8
    - trapezoid_period_6
    - trapezoid_period_8
  extra_training_groups: [constant_035_2]
  time_field: t_trial
  phase_field: phase
  phase_value: tracking
  ball_field: obs_pb
  theta_field: obs_theta
  drone_velocity_field: obs_vrz
  gap_factor: 2.5
  ball_window: 31
  ball_polyorder: 3
  theta_window: 11
  theta_polyorder: 3
  drone_velocity_window: 7
  drone_velocity_polyorder: 2
  edge_trim: 15
  min_segment_samples: 98
  rollout_steps: [6, 12, 30, 33]
  evaluation_steps: [6, 12, 30, 33, 60]
  validation_stride: 5
  speed_threshold_mps: 0.02

causal_rollout:
  enabled: true
  ball_velocity_field: obs_vb
  command_field: nmpc_command_z
  pending_command_fields: [pending_command_0, pending_command_1, pending_command_2]
  delay_steps_parameter: predictor.delay_steps
  response_enabled_parameter: controller.response.enabled
  response_tau_parameter: controller.response.tau_s
  response_gain_parameter: controller.response.gain
  response_bias_parameter: controller.response.bias
  max_velocity_parameter: controller.constraints.max_velocity
  smooth_rollout_weight: 0.25
  jacobian_weight: 0.1
  jacobian_norm_limit_mps2: 0.02
  jacobian_p99_factor: 1.25
  jacobian_max_factor: 2.0
  state_scale_floor: 0.000001

model:
  input_names: [pb, vb, theta, omega, a_nom]
  hidden_dims: [16, 16]
  output_limit_mps2: 0.25
  dtype: float64

loss:
  position_scale_m: 0.01
  velocity_scale_mps: 0.05
  horizon_weights: [0.15, 0.20, 0.30, 0.35]
  point_weight: 0.25
  huber_beta_mps2: 0.02
  jacobian_weight: 0.0

training:
  seed: 7
  batch_size: 128
  steps_per_epoch: 32
  max_epochs: 500
  learning_rate: 0.001
  weight_decay: 0.00001
  lr_patience: 10
  lr_factor: 0.5
  early_stopping_patience: 40
  gradient_clip_norm: 1.0
  validation_max_windows: 2048

runtime:
  device: auto
  gpu_min_speedup: 1.20
  benchmark_warmup_steps: 20
  benchmark_steps: 100

wandb:
  enabled: true
  mode: auto
  project: aerial-balance-residual-dynamics
  entity: null
  group: real_world_20260815_mlp5_causal_rollout
  tags: [real_world, acceleration_residual, five_input_mlp, causal_rollout]
  log_batch_interval: 20
  log_histogram_interval_epochs: 10
  init_timeout_s: 30

acceptance:
  residual_rmse_max_mps2: 0.05
  rollout_improvement_min: 0.30
  per_dynamic_degradation_max: 0.10
  static_total_acc_median_max_mps2: 0.02
  saturation_rate_max: 0.01
